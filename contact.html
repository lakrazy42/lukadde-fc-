<!DOCTYPE html>
<html>
<head>
<title>Lukadde FC - Contact</title>
<link rel="stylesheet" href="kin.css">
</head>
<body>

<div class="menu">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</div>

<h1 style="font-size: 38px !important; color: #0d47a1;">Contact Lukadde FC</h1>

<div class="box">
  <h2>Talk To Us</h2>
  <p>Phone: 0754444415</p>
  <p> tiktok : lukadde fc</p>
  <p>Location: Lukadde, Kampala</p>
</div>
  <h2>Join The Club</h2>
  <p>Do you want to play for Lukadde FC?</p>
<form onsubmit="sendForm(event)">
  <label>NAME:</label><br>
  <input type="text" id="name" required style="width:90%; padding:10px;"><br><br>

  <label>EMAIL:</label><br>
  <input type="email" id="email" required style="width:90%; padding:10px;"><br><br>

  <label>POSITION:</label><br>
  <select id="position" style="width:90%; padding:10px;">
    <option>Goalkeeper</option>
    <option>Defender</option>
    <option>Midfielder</option>
    <option>Striker</option>
  </select><br><br>

  <label>SHIRT NUMBER:</label><br>
  <input type="number" id="shirt" min="1" max="99" placeholder="e.g. 10" required style="width:90%; padding:10px;"><br><br>

  <label>MESSAGE:</label><br>
  <textarea id="message" rows="4" style="width:90%; padding:10px;"></textarea><br><br>

  <button type="submit" style="background:blue; color:white; padding:12px 30px; border:none;">SUBMIT</button>
</form>

<script>
function sendForm(event) {
  event.preventDefault();
  var name = document.getElementById('name').value;
  var email = document.getElementById('email').value;
  var position = document.getElementById('position').value;
  var shirt = document.getElementById('shirt').value;
  var message = document.getElementById('message').value;

  var phone = "256754444415";
  var clubEmail = "riykinnsubuga42@gmail.com";

  var text = "New Lukadde FC Player:%0AName: " + name + "%0AEmail: " + email + "%0APosition: " + position + "%0AShirt Number: " + shirt + "%0AMessage: " + message;

  // 1. Open WhatsApp
  window.open("https://wa.me/" + phone + "?text=" + text, "_blank");

  // 2. Open Email after 1 second
  setTimeout(function() {
    var subject = "New Player: " + name + " - Shirt " + shirt;
    var body = "Name: " + name + "%0AEmail: " + email + "%0APosition: " + position + "%0AShirt Number: " + shirt + "%0AMessage: " + message;
    window.location.href = "mailto:" + clubEmail + "?subject=" + encodeURIComponent(subject) + "&body=" + body;
  }, 1000);
}
    </script>
</body>
</html>
